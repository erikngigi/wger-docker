# Define the backend Docker container
upstream wger_backend {
    server 127.0.0.1:81;
    keepalive 32;
}

# Redirect HTTP (Port 80) traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fitness.ericngigi.com;

    return 301 https://$host$request_uri;
}

# HTTPS (Port 443) Server Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fitness.ericngigi.com;

    # SSL Certificates (update these paths to match your certificate locations)
    ssl_certificate /etc/letsencrypt/live/fitness.ericngigi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitness.ericngigi.com/privkey.pem;

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # WebSocket & Upgrade Headers (required for live updates / PowerSync)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        proxy_pass http://wger_backend;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Prevent issues with large uploads/images in wger
        client_max_body_size 100M;
    }
}
